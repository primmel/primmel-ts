name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Type-check
        run: yarn compile
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Check out the specification (the registry-parity counterpart)
        uses: actions/checkout@v4
        with:
          repository: primmel/spec
          path: spec
      - name: Registry parity (R1) — Annex A against the parser, both directions
        run: yarn workspace @primmel/primmel annex-a --check
        env:
          PRIMMEL_SPEC_SOURCES: ${{ github.workspace }}/spec/sources
      - name: Registry parity (R2) — Annex B against the checker registry
        run: yarn workspace @primmel/primmel annex-b --check
        env:
          PRIMMEL_SPEC_SOURCES: ${{ github.workspace }}/spec/sources
      - name: Conformance suite (the reference toolchain against the corpus)
        run: yarn test:conformance
      # The browser bundle's own gate: build it and import it (the
      # node-builtin shims — a no-op shim shipped broken bundles for
      # every release since the locator plane joined the import graph;
      # the editor's app build consumes this file via the package's
      # browser export).
      - name: Browser bundle (build + the import/export gate)
        run: |
          yarn workspace @primmel/primmel run build:browser
          yarn workspace @primmel/primmel test:browser
      - name: The second checker's corpus leg (parsanol from npm, PINNED — no checkout needed)
        run: |
          SCRATCH="$(mktemp -d)"
          cd "$SCRATCH"
          # the version is PINNED: parsanol publishes fast (three releases
          # in one day broke this leg wholesale — 0.10.35 shipped a wire
          # change and the adapter executed zero cases), and a floating
          # install turns the parsanol owner's release into this repo's
          # red CI. The bump is deliberate: verify the new version
          # against this leg LOCALLY, then raise the pin.
          npm install parsanol@0.10.32 --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          PRIMMEL_PARSANOL_TS="$SCRATCH/node_modules/parsanol" yarn test:conformance:checker2
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Build the kernel CLI
        run: yarn workspace @primmel/primmel run build:cli
      # The corpus is a private sibling repo (oimlsmart/model-library). A
      # fork PR has no token, so the checkout is allowed to fail and the
      # smoke script then skips LOUDLY — a skipped corpus gate never reads
      # as a pass.
      - name: Check out the model corpus
        id: corpus
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/model-library
          path: .corpus
          token: ${{ secrets.OIMLSMART_CORPUS_TOKEN }}
      # The pair-smoke: when this kernel branch carries a corpus change
      # under the SAME branch name (the cross-repo waves' convention),
      # the smoke runs against THAT branch — the mutual-gate dance's
      # red-by-design CI becomes green-with-proof. A branch pair that
      # exists but fails still fails here: the healing proof rides the
      # pair, never the hope.
      - name: Prefer the paired corpus branch (same branch name, when it exists)
        if: steps.corpus.outcome == 'success' && github.head_ref != ''
        working-directory: .corpus
        run: |
          git fetch origin "${{ github.head_ref }}" && git checkout "${{ github.head_ref }}" \
            && echo "paired corpus branch: ${{ github.head_ref }}" \
            || echo "no paired branch — the smoke runs on the corpus default branch"
      - name: Composed corpus smoke (strict + audit, the full uses closure)
        env:
          PRIMMEL_CORPUS_DIR: ${{ github.workspace }}/.corpus
        run: node --import tsx scripts/check-corpus.mts

      - name: Build package
        run: yarn build
      - name: Exports-map proof (the built package's subpaths)
        run: yarn workspace @primmel/primmel test:exports
