name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Type-check
        run: yarn compile
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Check out the specification (the registry-parity counterpart)
        uses: actions/checkout@v4
        with:
          repository: primmel/spec
          path: spec
      - name: Registry parity (R1) — Annex A against the parser, both directions
        run: yarn workspace @primmel/primmel annex-a --check
        env:
          PRIMMEL_SPEC_SOURCES: ${{ github.workspace }}/spec/sources
      - name: Conformance suite (the reference toolchain against the corpus)
        run: yarn test:conformance
      - name: Build package
        run: yarn build
      - name: Exports-map proof (the built package's subpaths)
        run: yarn workspace @primmel/primmel test:exports
