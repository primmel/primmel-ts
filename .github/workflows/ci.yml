name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Type-check
        run: yarn compile
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Check out the specification (the registry-parity counterpart)
        uses: actions/checkout@v4
        with:
          repository: primmel/spec
          path: spec
      - name: Registry parity (R1) — Annex A against the parser, both directions
        run: yarn workspace @primmel/primmel annex-a --check
      - name: Registry parity (R2) — Annex B against the checker registry
        run: yarn workspace @primmel/primmel annex-b --check
        env:
          PRIMMEL_SPEC_SOURCES: ${{ github.workspace }}/spec/sources
      - name: Conformance suite (the reference toolchain against the corpus)
        run: yarn test:conformance
      - name: The second checker's corpus leg (parsanol from npm — no checkout needed)
        run: |
          SCRATCH="$(mktemp -d)"
          cd "$SCRATCH"
          npm init -y > /dev/null 2>&1
          npm install parsanol --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          PRIMMEL_PARSANOL_TS="$SCRATCH/node_modules/parsanol" yarn test:conformance:checker2
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Build the kernel CLI
        run: yarn workspace @primmel/primmel run build:cli
      # The corpus is a private sibling repo (oimlsmart/model-library). A
      # fork PR has no token, so the checkout is allowed to fail and the
      # smoke script then skips LOUDLY — a skipped corpus gate never reads
      # as a pass.
      - name: Check out the model corpus
        id: corpus
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/model-library
          path: .corpus
          token: ${{ secrets.OIMLSMART_CORPUS_TOKEN }}
      - name: Composed corpus smoke (strict + audit, the full uses closure)
        env:
          PRIMMEL_CORPUS_DIR: ${{ github.workspace }}/.corpus
        run: node --import tsx scripts/check-corpus.mts

      - name: Build package
        run: yarn build
      - name: Exports-map proof (the built package's subpaths)
        run: yarn workspace @primmel/primmel test:exports
