name: Release

# Trusted publishing to npm via GitHub Actions OIDC (no NPM_TOKEN).
# Triggers when a `v*` tag is pushed, or manually via workflow_dispatch.
# To release: bump packages/primmel/package.json, push tag `v<x.y.z>`,
# this workflow publishes and creates the GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.5.3)'
        required: true
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @primmel/primmel run build
      - run: yarn workspace @primmel/primmel run build:browser
      - run: yarn workspace @primmel/primmel run build:cli
      - run: yarn workspace @primmel/primmel run test
      - name: Set version from workflow input (patch release)
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/primmel
        run: |
          current=$(node -p "require('./package.json').version")
          if [ "$current" != "${{ inputs.version }}" ]; then
            npm version ${{ inputs.version }} --no-git-tag-version
          fi
      - name: Verify version matches the tag
        if: github.event_name == 'push'
        working-directory: packages/primmel
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION"
          echo "tag:          $TAG_VERSION"
          [ "$PKG_VERSION" = "$TAG_VERSION" ]
      - run: npm publish
        working-directory: packages/primmel

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
